name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v tests
      # macOS and Windows runners have a usable clipboard, so exercise the real
      # pbcopy/PowerShell paths there too.
      - if: runner.os != 'Linux'
        run: python -m pytest -v tests -k real_clipboard
        env:
          LANDROP_TEST_REAL_CLIPBOARD: "1"
